name: Feature request
description: Propose a focused improvement to the VS Code workbench or compatibility layer.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow problem without including private project data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Workbench UI
        - Runtime and packaging
        - Windows and PowerShell compatibility
        - Context and attachments
        - Session management
        - Codex / Claude handoff
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Compatibility
      options:
        - label: This proposal can preserve no-install activation and SecretStorage boundaries.
        - label: This proposal can preserve read-only source sessions for cross-agent handoff.
